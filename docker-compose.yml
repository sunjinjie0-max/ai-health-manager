name: aihealth

services:
  backend:
    build:
      context: ./ai-health-manager-backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    container_name: ai-health-backend
    env_file:
      - ./ai-health-manager-backend/.env
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_health
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      HF_HOME: /data/huggingface
      HUGGINGFACE_HUB_CACHE: /data/huggingface/hub
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "30"
      RAG_EMBEDDING_MODEL: dashscope-text-embedding-v4
      RAG_EMBEDDING_BATCH_SIZE: 10
      RAG_USE_RERANKER: "false"
    volumes:
      - hf_cache:/data/huggingface
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: ai-health-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: ai-health-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:15
    container_name: ai-health-postgres
    environment:
      POSTGRES_DB: ai_health
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  es_data:
  redis_data:
  pg_data:
  hf_cache:
